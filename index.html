<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC9E2">
<meta name="description" content="ฝึกภาษาอังกฤษทุกวันกับเจลลี่บู">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>English Progress Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=Fredoka:wght@500;600;700&display=swap">
</head>
<body>
<style>
/* Layout: a storybook app — dreamy sky behind, one illustrated screen at a time, floating HUD and pill-shaped bottom bar */
:root{
  --sky1:#FFE3EF; --sky2:#EADFFF; --sky3:#FFEFD9; --bg:#FFF4F9; --bg2:#F5EEFF; --card:#FFFFFF; --ink:#3F2D5C; --ink2:#7B6A93; --line:#EBDDF6; --edge:#4A3566;
  --lav:#E3D6FF; --lav-d:#8B5CF6; --pink:#FFD6E7; --pink-d:#EC5B9C; --mint:#CDF5E6; --mint-d:#1FA97A;
  --peach:#FFE2CC; --peach-d:#F07A2E; --butter:#FFF3B8; --butter-d:#D99A00; --sky:#D6EEFF; --sky-d:#2D8FD8;
  --glow:0 12px 28px rgba(110,70,160,.16);
  --display:"Mali","Fredoka",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai Looped","Mali",system-ui,sans-serif;
  --num:"Fredoka","Mali",system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky1:#1B1636; --sky2:#2B1F52; --sky3:#3A2350; --bg:#211A3D; --bg2:#2C2350; --card:#2D2450; --ink:#FBF3FF; --ink2:#C9B9E6; --line:#45387A; --edge:#0F0A24;
  --lav:#46368A; --lav-d:#B9A0FF; --pink:#62285A; --pink-d:#FF8CC2; --mint:#174D45; --mint-d:#5FE3B4;
  --peach:#5E3420; --peach-d:#FFAE70; --butter:#584718; --butter-d:#FFD966; --sky:#1C3C64; --sky-d:#84C8FF;
  --glow:0 12px 28px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --sky1:#1B1636; --sky2:#2B1F52; --sky3:#3A2350; --bg:#211A3D; --bg2:#2C2350; --card:#2D2450; --ink:#FBF3FF; --ink2:#C9B9E6; --line:#45387A; --edge:#0F0A24;
  --lav:#46368A; --lav-d:#B9A0FF; --pink:#62285A; --pink-d:#FF8CC2; --mint:#174D45; --mint-d:#5FE3B4;
  --peach:#5E3420; --peach-d:#FFAE70; --butter:#584718; --butter-d:#FFD966; --sky:#1C3C64; --sky-d:#84C8FF;
  --glow:0 12px 28px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.hmap.space{aspect-ratio:6/5;border-color:#2A1A55;box-shadow:0 10px 28px rgba(59,26,120,.35),inset 0 0 0 2px rgba(255,255,255,.08)}
.hmap.space .stars .tw{animation:twinkle 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.hmap.space .shoot{animation:shoot 7s ease-in infinite;transform:translate(400px,-20px)}
@keyframes shoot{0%,78%{transform:translate(400px,-20px);opacity:0}80%{opacity:1;transform:translate(330px,30px)}92%{opacity:0;transform:translate(180px,85px)}100%{opacity:0;transform:translate(180px,85px)}}
.planet{width:50px;height:50px;border:2.5px solid #2A1A55;box-shadow:inset -7px -7px 0 rgba(0,0,0,.18),inset 5px 5px 0 rgba(255,255,255,.35),0 0 18px rgba(255,255,255,.25);color:#2A1A55;padding:10px;overflow:visible}
.planet .pl-ico{width:100%;height:100%;display:grid;place-items:center;position:relative;z-index:2}
.planet .pl-ico .ico{width:24px;height:24px}
.planet.p0{background:radial-gradient(circle at 35% 30%,#E7D8FF,#A985FF 60%,#6E45E0)}
.planet.p1{background:radial-gradient(circle at 35% 30%,#FFE0EE,#FF8CC2 60%,#E0468E)}
.planet.p2{background:radial-gradient(circle at 35% 30%,#D9FFF0,#5FE3B4 60%,#1FA97A)}
.planet.p3{background:radial-gradient(circle at 35% 30%,#FFF0D6,#FFAE70 60%,#F07A2E)}
.planet.p4{background:radial-gradient(circle at 35% 30%,#E0F4FF,#7CC8FF 60%,#2D8FD8)}
.planet.p0::after,.planet.p2::after,.planet.p4::after{content:"";position:absolute;left:-14px;right:-14px;top:50%;height:12px;margin-top:-6px;border-radius:50%;border:2.5px solid rgba(255,240,180,.9);transform:rotate(-18deg);z-index:1;pointer-events:none;animation:ring 6s linear infinite}
@keyframes ring{0%,100%{transform:rotate(-18deg) scaleX(1)}50%{transform:rotate(-12deg) scaleX(.94)}}
.planet.p1::before,.planet.p3::before{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:rgba(0,0,0,.14);top:8px;right:9px;box-shadow:-20px 22px 0 -2px rgba(0,0,0,.12),-4px 26px 0 -3px rgba(0,0,0,.1)}
.planet.done{filter:saturate(1.1)}
.planet.done .pl-ico{background:#169C6F;border-radius:50%;border:2px solid #fff}
.planet.done .pl-ico .ico{width:18px;height:18px}
.planet .flag{position:absolute;top:-20px;left:30px;width:3px;height:22px;background:#fff;border-radius:2px;z-index:3}
.planet .flag::after{content:"";position:absolute;left:3px;top:0;width:14px;height:10px;background:#FFD24A;clip-path:polygon(0 0,100% 50%,0 100%);animation:wave .8s ease-in-out infinite alternate;transform-origin:0 50%}
.planet.now{animation:none;box-shadow:inset -7px -7px 0 rgba(0,0,0,.18),inset 5px 5px 0 rgba(255,255,255,.35),0 0 0 5px rgba(255,255,255,.25),0 0 26px 6px rgba(255,140,194,.85)}
.planet .pl-name{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;white-space:nowrap;font-family:var(--display);font-weight:700;font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);z-index:3}
.hchest.station .st-ring{position:absolute;inset:-12px;border-radius:50%;border:2.5px dashed rgba(255,226,122,.85);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hchest.station{filter:drop-shadow(0 0 12px rgba(255,210,74,.8))}
.htoken.rocket{width:40px;height:56px;transform:translate(-50%,-50%) rotate(var(--ang,0deg));transform-origin:50% 50%;transition:left 1.1s var(--spring),top 1.1s var(--spring),transform .8s var(--spring);z-index:4;animation:hover 1.6s ease-in-out infinite}
@keyframes hover{0%,100%{margin-top:0}50%{margin-top:-5px}}
.htoken.rocket svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.htoken.rocket .flame{animation:flame .25s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
@keyframes flame{from{transform:scaleY(.8)}to{transform:scaleY(1.2)}}

.hmap{position:relative;width:100%;aspect-ratio:3/2;border-radius:24px;border:2.5px solid var(--edge);overflow:hidden;box-shadow:inset 0 -6px 0 rgba(0,0,0,.06)}
.hmap>svg{position:absolute;inset:0;width:100%;height:100%}
.hnode{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:2.5px solid #4A3566;background:#fff;display:grid;place-items:center;cursor:pointer;padding:7px;box-shadow:0 4px 0 #4A3566;transition:transform .3s var(--spring);color:#3F2D5C}
.hnode:hover{transform:translate(-50%,-50%) scale(1.1)}
.hnode.done{background:linear-gradient(180deg,#4FD9A6,#169C6F)}
.hnode.now{background:linear-gradient(180deg,#FF8CC0,#E5468E);color:#fff;animation:glowp 1.8s ease-in-out infinite}
.hchest{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border:0;background:none;padding:0;cursor:default;filter:drop-shadow(0 4px 0 rgba(74,53,102,.35))}
.hchest .ico{width:100%;height:100%}
.hchest.ready{cursor:pointer;animation:wiggle 1.1s var(--spring) infinite}
.hchest.ready::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,122,.75),transparent 65%);z-index:-1;animation:halo 1.6s ease-in-out infinite}
.htoken{position:absolute;transform:translate(-50%,-92%);transition:left .9s var(--spring),top .9s var(--spring);pointer-events:none;z-index:2}
.htoken .mascot{width:58px;height:62px}
.treasure-got{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:20px;background:linear-gradient(135deg,#FFF3B8,#FFE2CC);border:2px solid #4A3566;color:#3F2D5C}
.qi{position:relative}
.qnum{position:absolute;top:-8px;left:-8px;width:20px;height:20px;border-radius:50%;background:#4A3566;color:#fff;font-size:11px;display:grid;place-items:center;font-weight:700}
.week i.tr{background:var(--butter);border-color:var(--edge)}
.week i.tr .ico{width:24px;height:24px}
.reveal{animation:revealSpin 1s var(--spring)}
@keyframes revealSpin{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
.modal.shake{animation:shake .4s}

.banner{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-radius:30px;border:2.5px solid var(--edge);padding:16px 14px 16px 20px;position:relative;overflow:hidden;box-shadow:var(--glow);background:linear-gradient(135deg,var(--pink),var(--lav) 55%,var(--sky));animation:pop .6s var(--spring)}
.banner::before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-50px;top:-70px;background:rgba(255,255,255,.35)}
.banner::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;left:-30px;bottom:-40px;background:rgba(255,255,255,.25)}
.banner .bn-text{position:relative;z-index:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.banner h1{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.25}
.banner p{font-size:13.5px;color:var(--ink)}
.banner .mascot{width:92px;height:98px;position:relative;z-index:1}
.banner.big .mascot{width:122px;height:130px}
.banner.big h1{font-size:26px}
.banner .bubble{margin-top:4px;font-size:14.5px}
.banner .eyebrow{font-size:12.5px;font-weight:600;color:var(--ink2);font-family:var(--display)}
.banner.course{background:linear-gradient(135deg,var(--sky),var(--lav) 60%,var(--pink))}
.banner.review{background:linear-gradient(135deg,var(--lav),var(--pink) 60%,var(--peach))}
.banner.speak{background:linear-gradient(135deg,var(--peach),var(--pink) 60%,var(--lav))}
.banner.bank{background:linear-gradient(135deg,var(--mint),var(--sky) 60%,var(--lav))}
.banner.stats{background:linear-gradient(135deg,var(--butter),var(--peach) 50%,var(--pink))}
.skybg .rise{position:absolute;bottom:-40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(255,182,214,.35) 60%,rgba(255,182,214,.1));border:1.5px solid rgba(255,255,255,.7);animation:rise linear infinite}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .skybg .rise{opacity:.35}}
:root[data-theme="dark"] .skybg .rise{opacity:.35}
.skybg .rise.hrt{border:0;border-radius:0;background:none}
.skybg .rise.hrt::before{content:"";position:absolute;inset:0;background:#FF9EC6;opacity:.45;clip-path:path('M5 9C2 6 0 4.5 0 2.7 0 1.2 1.2 0 2.6 0 3.6 0 4.5.6 5 1.4 5.5.6 6.4 0 7.4 0 8.8 0 10 1.2 10 2.7 10 4.5 8 6 5 9z');transform:scale(1.4);transform-origin:0 0}
@keyframes rise{from{transform:translateY(0) translateX(0)}50%{transform:translateY(-55vh) translateX(18px)}to{transform:translateY(-115vh) translateX(-10px)}}
.splash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,#FFD6E7,#E3D6FF 55%,#D6EEFF);animation:fade .4s}
.splash.out{animation:spOut .45s forwards}
@keyframes spOut{to{opacity:0;transform:scale(1.04)}}
.sp-float{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.sp-float i{position:absolute;bottom:-30px;border-radius:50%;background:rgba(255,255,255,.7);animation:rise linear infinite}
.sp-float i.hrt{background:#FF8CC2;opacity:.55;border-radius:50% 50% 0 50%;transform:rotate(45deg)}
.sp-card{position:relative;z-index:1;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);border:3px solid #4A3566;border-radius:36px;padding:22px 22px 18px;max-width:380px;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;box-shadow:0 18px 40px rgba(110,70,160,.25);animation:pop .7s var(--spring);color:#3F2D5C}
.sp-card .muted{color:#6E5A86}
.sp-m .mascot{width:150px;height:160px}
.sp-title{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.2;background:linear-gradient(90deg,#EC5B9C,#8B5CF6);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-card .eyebrow{font-family:var(--num);font-weight:600;letter-spacing:.5px;color:#8B5CF6;font-size:13px}
.sp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin:6px 0}
.sp-stat{border:2px solid #4A3566;border-radius:18px;padding:6px 4px;display:flex;flex-direction:column;color:#3F2D5C}
.sp-stat b{font-family:var(--num);font-size:20px;line-height:1.2}
.sp-stat span{font-size:11.5px}
.sp-go{width:100%;font-size:17px;padding:12px}
.card{transition:transform .3s var(--spring),box-shadow .3s}
.card:hover{transform:translateY(-2px)}
.nav button[aria-current="page"]::after{content:"";position:absolute;bottom:-3px;width:6px;height:6px;border-radius:50%;background:var(--pink-d)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .splash{background:linear-gradient(160deg,#3A1F4A,#2B1F52 55%,#1C3C64)}}
:root[data-theme="dark"] .splash{background:linear-gradient(160deg,#3A1F4A,#2B1F52 55%,#1C3C64)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sp-card{background:rgba(40,28,74,.9);color:#F3EAFF;border-color:#C9B8F0;box-shadow:0 18px 40px rgba(0,0,0,.45)} :root:not([data-theme="light"]) .sp-card .muted{color:#CBB9E8} :root:not([data-theme="light"]) .sp-stat{color:#F3EAFF;border-color:#C9B8F0} :root:not([data-theme="light"]) .sp-card .eyebrow{color:#C4A8FF}}
:root[data-theme="dark"] .sp-card{background:rgba(40,28,74,.9);color:#F3EAFF;border-color:#C9B8F0;box-shadow:0 18px 40px rgba(0,0,0,.45)}:root[data-theme="dark"] .sp-card .muted{color:#CBB9E8}:root[data-theme="dark"] .sp-stat{color:#F3EAFF;border-color:#C9B8F0}:root[data-theme="dark"] .sp-card .eyebrow{color:#C4A8FF}

.mascot.jelly .ghost{animation:jwob 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes jwob{0%,100%{transform:scale(1,1) rotate(0)}25%{transform:scale(1.03,.97) rotate(-2deg)}50%{transform:scale(.97,1.04) rotate(0)}75%{transform:scale(1.02,.98) rotate(2deg)}}
.mascot .jheart{animation:beat 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.mascot .bub{animation:bub 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bub{0%{transform:translateY(4px);opacity:0}30%{opacity:1}100%{transform:translateY(-26px);opacity:0}}

.mascot .eyeR.eyes{animation:wink 6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes wink{0%,70%,80%,100%{transform:scaleY(1)}74%,77%{transform:scaleY(.08)}}
.mascot .blep{animation:blep 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0%}
@keyframes blep{0%,40%,100%{transform:scaleY(1)}55%{transform:scaleY(1.45)}70%{transform:scaleY(.9)}}
.mascot .bow{animation:bowb 2.6s var(--spring) infinite;transform-box:fill-box;transform-origin:50% 60%}
@keyframes bowb{0%,65%,100%{transform:rotate(0) scale(1)}75%{transform:rotate(-12deg) scale(1.12)}87%{transform:rotate(6deg)}}

.mascot .ant{animation:antb 2.4s var(--spring) infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes antb{0%,60%,100%{transform:rotate(0) scale(1)}70%{transform:rotate(-14deg) scale(1.15)}80%{transform:rotate(10deg)}90%{transform:rotate(-4deg)}}
.mascot.talkie .body{animation:sway2 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:30% 100%}
.mascot.think .ant{animation:thinkb 1.4s ease-in-out infinite}
@keyframes thinkb{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-4px) rotate(6deg)}}

.mascot .ghost{animation:sway2 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway2{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.mascot .lantern{animation:lant 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0%}
@keyframes lant{0%,100%{transform:rotate(-10deg);filter:drop-shadow(0 0 0 #FFD24A)}50%{transform:rotate(10deg);filter:drop-shadow(0 0 6px #FFD24A)}}
.mascot .shadow{animation:shad 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes shad{0%,100%{transform:scaleX(1)}45%,55%{transform:scaleX(.8)}}

.mascot{width:120px;height:128px}
.mascot .halo{animation:halo 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes halo{0%,100%{opacity:.7;transform:scale(.93)}50%{opacity:1;transform:scale(1.06)}}
.mascot .filament{animation:beat 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(.95)}45%{transform:scale(1.1)}}
.mascot .wingL{animation:flapL .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 85%}
.mascot .wingR{animation:flapR .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 85%}
@keyframes flapL{from{transform:rotate(8deg)}to{transform:rotate(-16deg)}}
@keyframes flapR{from{transform:rotate(-8deg)}to{transform:rotate(16deg)}}
.mascot.sleepy .wingL,.mascot.sleepy .wingR{animation-duration:1.6s}
.mascot.cheer{animation:jump .9s var(--spring) infinite}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-14px) scale(.95,1.06)}60%{transform:translateY(0) scale(1.06,.94)}}
.big3k .track b{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 6px,transparent 6px 12px)}

html{background:var(--sky1)}
body{background:linear-gradient(170deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;padding-inline:16px;padding-block:14px 112px;min-height:100%}
.skybg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.skybg .cloud{position:absolute;opacity:.85;animation:drift 60s linear infinite}
.skybg .cloud svg{width:100%;height:auto;display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .skybg .cloud{opacity:.14}}
:root[data-theme="dark"] .skybg .cloud{opacity:.14}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.skybg .sp{position:absolute;width:14px;height:14px;animation:twinkle 3s ease-in-out infinite}
.skybg .sp svg{width:100%;height:100%}
@keyframes twinkle{0%,100%{transform:scale(.4) rotate(0);opacity:.3}50%{transform:scale(1) rotate(45deg);opacity:1}}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.35;margin:0;text-wrap:balance}
h2{font-size:22px} h3{font-size:18px}
p{margin:0}
.muted{color:var(--ink2)} .small{font-size:13px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:2.5px solid var(--edge);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--glow),inset 0 -5px 0 var(--line);min-width:0;position:relative}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{font-family:var(--display);font-size:15px;font-weight:600;border-radius:999px;padding:9px 20px;border:2.5px solid var(--edge);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:inset 0 -4px 0 var(--line),0 3px 0 var(--edge);transition:transform .25s var(--spring)}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn:active{transform:translateY(2px) scale(.97)}
.btn.primary{background:linear-gradient(180deg,#A985FF,#7C4DEB);color:#fff;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.15),0 3px 0 var(--edge)}
.btn.pink{background:linear-gradient(180deg,#FF8CC0,#E5468E);color:#fff;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.15),0 3px 0 var(--edge)}
.btn.mint{background:linear-gradient(180deg,#4FD9A6,#169C6F);color:#fff;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.15),0 3px 0 var(--edge)}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;color:var(--ink2);padding-inline:8px}
.btn.sm{font-size:13px;padding:5px 13px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,.nav button:focus-visible,.node:focus-visible{outline:3px solid var(--pink-d);outline-offset:3px}
input[type=text],input[type=number],input[type=date],textarea{font-family:var(--body);font-size:15px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:10px 13px;width:100%}
input:focus,textarea:focus{border-color:var(--lav-d)}
textarea{min-height:100px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:12.5px;font-weight:600;padding:2px 11px;border-radius:999px;border:2px solid var(--edge);background:var(--bg2);color:var(--ink)}
.pill.lav{background:var(--lav)} .pill.pink{background:var(--pink)} .pill.mint{background:var(--mint)} .pill.peach{background:var(--peach)} .pill.butter{background:var(--butter)} .pill.sky{background:var(--sky)}
.ico{display:inline-grid;place-items:center;flex:none}
.ico svg{width:100%;height:100%;display:block;overflow:visible}

/* HUD */
.hud{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;background:var(--card);border:2.5px solid var(--edge);border-radius:999px;padding:7px 16px 7px 7px;box-shadow:var(--glow);position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5}
.lvl{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6C8,#FFD24A 55%,#E9A800);border:2.5px solid var(--edge);display:grid;place-items:center;position:relative;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.lvl b{font-family:var(--num);font-size:21px;font-weight:700;color:#4A3566;line-height:1}
.lvl::after{content:"";position:absolute;top:5px;left:10px;width:12px;height:7px;border-radius:50%;background:rgba(255,255,255,.8);transform:rotate(-25deg)}
.xpbox{display:flex;flex-direction:column;gap:4px;min-width:0}
.xpbox .t{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;white-space:nowrap;overflow:hidden;font-family:var(--display);font-weight:600}
.xpbox .t span:first-child{overflow:hidden;text-overflow:ellipsis}
.bar{height:16px;border-radius:999px;background:var(--bg2);overflow:hidden;border:2px solid var(--edge);position:relative}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FF8CC0,#A985FF,#7CC8FF);box-shadow:inset 0 3px 0 rgba(255,255,255,.45);transition:width 1s var(--spring);position:relative}
.streak{display:flex;align-items:center;gap:3px;font-family:var(--num);font-size:22px;font-weight:700;color:var(--peach-d)}
.streak .ico{width:32px;height:32px}
.streak.lit .ico{animation:flick 1.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-4deg)}50%{transform:scale(.92,1.12) rotate(4deg)}}
.xpfloat{position:fixed;z-index:30;font-family:var(--num);font-weight:700;font-size:24px;color:#FFD24A;pointer-events:none;animation:floatUp 1.5s var(--spring) forwards;-webkit-text-stroke:1.5px #4A3566;paint-order:stroke fill}
@keyframes floatUp{0%{opacity:0;transform:translateY(12px) scale(.5)}20%{opacity:1;transform:translateY(0) scale(1.2)}100%{opacity:0;transform:translateY(-60px) scale(1)}}

/* mascot */
.hero{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center}
.mascot{width:112px;height:112px;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-8px) scale(.97,1.04)}55%{transform:translateY(-8px) scale(.97,1.04)}90%{transform:translateY(0) scale(1.04,.96)}}
.mascot .eyes{animation:blink 4.5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.mascot .sprout{animation:sway 2.6s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.mascot .arm{animation:wave 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 80%}
@keyframes wave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(18deg)}}
.bubble{background:var(--card);border:2.5px solid var(--edge);border-radius:24px 24px 24px 8px;padding:12px 15px;font-family:var(--display);font-weight:500;font-size:15.5px;position:relative;animation:pop .6s var(--spring);box-shadow:var(--glow)}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink2);font-family:var(--display);font-weight:600}
.week i{width:36px;height:36px;border-radius:50%;background:var(--bg2);border:2px dashed var(--line);display:grid;place-items:center}
.week i.l1{background:var(--peach);border:2.5px solid var(--edge)}
.week i.l2{background:linear-gradient(180deg,#4FD9A6,#169C6F);border:2.5px solid var(--edge)}
.week i .ico{width:20px;height:20px}
.week i.today{box-shadow:0 0 0 3px var(--card),0 0 0 5.5px var(--pink-d)}

/* quests */
.quests{display:flex;flex-direction:column;gap:10px}
.quest{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:22px;background:var(--bg);border:2px solid var(--line);transition:background .4s}
.quest .qi{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;border:2.5px solid var(--edge)}
.quest .qi .ico{width:28px;height:28px}
.quest.done{background:var(--mint);border-color:var(--mint-d)}
.quest.done .qt{text-decoration:line-through;text-decoration-thickness:2.5px;text-decoration-color:var(--mint-d)}
.qt{font-family:var(--display);font-weight:600}
.qbar{height:10px;border-radius:999px;background:var(--bg2);overflow:hidden;margin-top:4px;border:1.5px solid var(--line)}
.qbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#4FD9A6,#2D8FD8);transition:width .8s var(--spring)}
.chest{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:24px;background:linear-gradient(135deg,#FFF3B8,#FFE2CC);border:2.5px solid var(--edge);color:#4A3566}
.chest .ico{width:62px;height:62px}
.chest.ready .ico{animation:wiggle 1.1s var(--spring) infinite}
@keyframes wiggle{0%,100%{transform:rotate(0) scale(1)}15%{transform:rotate(-10deg) scale(1.08)}30%{transform:rotate(10deg) scale(1.08)}45%{transform:rotate(0) scale(1)}}

/* map */
.map{position:relative;display:flex;flex-direction:column;gap:6px;padding:6px 0}
.stage{display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:center;position:relative}
.stage.alt{grid-template-columns:1fr 78px}
.stage.alt .node{order:2}
.node{width:78px;height:78px;border-radius:50%;border:2.5px solid var(--edge);cursor:pointer;display:grid;place-items:center;font-family:var(--num);font-size:28px;font-weight:700;position:relative;box-shadow:inset 0 -6px 0 rgba(0,0,0,.14),inset 0 5px 0 rgba(255,255,255,.4),0 6px 0 var(--edge);transition:transform .3s var(--spring)}
.node:hover{transform:scale(1.08) rotate(-3deg)}
.node .ico{width:34px;height:34px}
.node.locked{background:var(--bg2);color:var(--ink2)}
.node.open{background:radial-gradient(circle at 35% 30%,#FFB5D8,#EC5B9C);color:#fff;animation:glowp 2s ease-in-out infinite}
.node.clear{background:radial-gradient(circle at 35% 30%,#8FF0C8,#1FA97A);color:#fff}
@keyframes glowp{0%,100%{box-shadow:inset 0 -6px 0 rgba(0,0,0,.14),inset 0 5px 0 rgba(255,255,255,.4),0 6px 0 var(--edge),0 0 0 0 rgba(236,91,156,.45)}50%{box-shadow:inset 0 -6px 0 rgba(0,0,0,.14),inset 0 5px 0 rgba(255,255,255,.4),0 6px 0 var(--edge),0 0 0 16px rgba(236,91,156,0)}}
.stage .info{background:var(--card);border:2.5px solid var(--edge);border-radius:22px;padding:8px 14px;min-width:0;box-shadow:var(--glow)}
.stage.sel .info{background:var(--butter)}
.trail{height:26px;margin-left:37px;border-left:4px dotted var(--lav-d)}
.stage.alt+.trail{margin-left:auto;margin-right:37px;border-left:none;border-right:4px dotted var(--lav-d)}
.zone{font-family:var(--display);font-weight:600;font-size:13px;text-align:center;padding:3px 14px;align-self:center;border-radius:999px;background:var(--edge);color:#fff}

/* flashcard game */
.gtop{display:flex;align-items:center;gap:10px}
.gtop .bar{flex:1}
.combo{font-family:var(--num);font-weight:700;color:var(--pink-d);min-width:72px;text-align:right}
.combo.bump{animation:bump .5s var(--spring)}
@keyframes bump{50%{transform:scale(1.5) rotate(-6deg)}}
.scene{perspective:1100px}
.flip{position:relative;min-height:250px;transform-style:preserve-3d;transition:transform .7s var(--spring)}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:28px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;border:2.5px solid var(--edge);box-shadow:inset 0 -6px 0 rgba(0,0,0,.06)}
.face.front{background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.7) 0 8%,transparent 9%),linear-gradient(160deg,var(--lav),var(--pink))}
.face.back{background:radial-gradient(circle at 80% 15%,rgba(255,255,255,.7) 0 8%,transparent 9%),linear-gradient(160deg,var(--mint),var(--sky));transform:rotateY(180deg)}
.face .th{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.5}
.face .en{font-family:var(--display);font-size:23px;font-weight:700}
.face .sub{font-size:14px;color:var(--ink2)}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rate .btn{padding:11px 4px}
.card.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px) rotate(-1deg)}40%,80%{transform:translateX(7px) rotate(1deg)}}
.stars{display:flex;gap:8px;justify-content:center}
.stars .ico{width:50px;height:50px}
.stars .ico.on{animation:starIn .7s var(--spring) backwards}
@keyframes starIn{0%{transform:scale(0) rotate(-90deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}

/* lists */
.plist{display:flex;flex-direction:column}
.pitem{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:2px dashed var(--line)}
.pitem:first-child{border-top:0}
.pitem .en{font-weight:600}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.hearts{display:inline-flex;gap:2px}
.hearts i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.hearts i.on{background:var(--pink-d)}

/* speak */
.ringwrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ring{width:112px;height:112px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tv{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--num);font-size:26px;font-weight:700}
.ring circle{transition:stroke-dashoffset .25s linear}
.boss{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:24px;background:var(--pink);border:2.5px solid var(--edge)}
.boss .ico{width:52px;height:52px;animation:bob 2.2s ease-in-out infinite}
.block{padding:12px 14px;border-radius:20px;background:var(--bg);border:2px solid var(--line)}
.block .lbl{font-size:12px;color:var(--ink2);margin-bottom:2px;font-family:var(--display);font-weight:600}
.block.nat{background:var(--mint);border-color:var(--mint-d)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 8px;border-bottom:2px dashed var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--ink2);font-weight:600;font-family:var(--display)}
td.r,th.r{text-align:right}
.wrong{color:var(--pink-d);text-decoration:line-through}
.right{color:var(--mint-d);font-weight:600}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border-radius:22px;padding:10px 14px;display:flex;flex-direction:column;border:2.5px solid var(--edge);color:var(--ink)!important}
.tile b{font-family:var(--num);font-size:28px;font-weight:700;line-height:1.2}
.tile span{font-size:12.5px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;line-height:1.35;font-family:var(--display);font-weight:600}
.badge .disc{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;border:2.5px solid var(--edge);box-shadow:inset 0 -5px 0 rgba(0,0,0,.1),inset 0 4px 0 rgba(255,255,255,.5),0 4px 0 var(--edge);transition:transform .3s var(--spring)}
.badge:hover .disc{transform:rotate(-8deg) scale(1.08)}
.badge .disc .ico{width:36px;height:36px}
.badge.off .disc{background:var(--bg2)!important;border-style:dashed;box-shadow:none}
.badge.off .disc .ico{opacity:.45}
.badge.off span{color:var(--ink2)}
.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px;overflow-x:auto}
.heat i{border-radius:4px;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line)}
.heat i.l1{background:var(--peach-d)} .heat i.l2{background:var(--mint-d)}
.chart svg{width:100%;height:auto;display:block}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.nav .in{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:var(--card);border:2.5px solid var(--edge);border-radius:30px;padding:6px;width:100%;max-width:560px;box-shadow:var(--glow)}
.nav button{border:0;background:none;border-radius:22px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink2);font-family:var(--display);font-weight:600;font-size:11.5px;cursor:pointer;position:relative;transition:transform .3s var(--spring)}
.nav button:hover{transform:translateY(-2px)}
.nav button .ico{width:26px;height:26px}
.nav button[aria-current="page"]{background:var(--lav);color:var(--ink)}
.nav button[aria-current="page"] .ico{animation:hop .6s var(--spring)}
@keyframes hop{40%{transform:translateY(-6px) scale(1.15)}}
.nav .dot{position:absolute;top:3px;right:calc(50% - 20px);width:11px;height:11px;border-radius:50%;background:var(--pink-d);border:2px solid var(--card);animation:pulseDot 1.6s ease-in-out infinite}
@keyframes pulseDot{50%{transform:scale(1.3)}}

/* overlay & toast */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(40,25,70,.45);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:34px;padding:26px 22px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;animation:pop .7s var(--spring);border:3px solid var(--edge);box-shadow:var(--glow)}
.modal .big{font-family:var(--num);font-size:58px;font-weight:700;line-height:1;background:linear-gradient(90deg,#EC5B9C,#8B5CF6);-webkit-background-clip:text;background-clip:text;color:transparent}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%);z-index:35;background:#FFF3B8;border:2.5px solid #4A3566;border-radius:24px;padding:10px 16px;display:flex;gap:10px;align-items:center;box-shadow:var(--glow);animation:drop .7s var(--spring);max-width:calc(100% - 32px);color:#3F2D5C}
.toast .disc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;border:2.5px solid #4A3566}
.toast .disc .ico{width:26px;height:26px}
@keyframes drop{from{transform:translate(-50%,-40px) scale(.7);opacity:0}}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.notice{font-size:13px;padding:10px 14px;border-radius:18px;background:#FFF3B8;color:#3F2D5C;border:2px solid #4A3566}
.spin{display:inline-block;width:14px;height:14px;border:3px solid rgba(255,255,255,.4);border-top-color:currentColor;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
details summary{cursor:pointer;font-family:var(--display);font-weight:600}
.screen{display:flex;flex-direction:column;gap:16px}
.screen>*{animation:enter .55s var(--spring) backwards}
.screen>*:nth-child(2){animation-delay:.06s}.screen>*:nth-child(3){animation-delay:.12s}.screen>*:nth-child(4){animation-delay:.18s}.screen>*:nth-child(5){animation-delay:.24s}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.97)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* v5 additions */
.mascot{width:120px;height:120px}
.mascot .earR{animation:earR 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 95%}
.mascot .earL{animation:earL 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 95%}
@keyframes earR{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(14deg)}86%{transform:rotate(-4deg)}}
@keyframes earL{0%,60%,100%{transform:rotate(0)}68%{transform:rotate(-10deg)}}
.mascot .twk{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.hero{grid-template-columns:120px 1fr}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--bg2);border:2.5px solid var(--edge);border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 8px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--edge)}
.worldbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.world{border:2.5px solid var(--edge);border-radius:20px;padding:8px 6px;text-align:center;cursor:pointer;background:var(--card);font-family:var(--display);font-weight:600;transition:transform .3s var(--spring);color:var(--ink)}
.world:hover{transform:translateY(-2px)}
.world .lv{font-family:var(--num);font-size:20px;font-weight:700;line-height:1.1}
.world .sm{font-size:11px;color:var(--ink2)}
.world[aria-pressed="true"]{box-shadow:0 4px 0 var(--edge)}
.world.locked{opacity:.55}
.units{display:flex;flex-direction:column;gap:10px}
.unit{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:22px;border:2.5px solid var(--edge);background:var(--card);cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .3s var(--spring)}
.unit:hover{transform:translateX(3px)}
.unit.locked{background:var(--bg2);border-style:dashed;cursor:default}
.unit.locked:hover{transform:none}
.uring{width:58px;height:58px;position:relative}
.uring svg{width:100%;height:100%;transform:rotate(-90deg)}
.uring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--num);font-size:17px}
.tag{font-size:11px;font-weight:600;font-family:var(--display);padding:1px 8px;border-radius:999px;border:1.5px solid var(--edge)}
.tag.life{background:var(--pink)} .tag.work{background:var(--sky)} .tag.exam{background:var(--butter)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.act{border:2.5px solid var(--edge);border-radius:22px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink);box-shadow:0 4px 0 var(--edge);transition:transform .25s var(--spring)}
.act:hover{transform:translateY(-3px)}

function parseAIJson(text) {
  let t = String(text || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  try { return JSON.parse(t); } catch {}
  const a = t.search(/[\[{]/); const close = t[a] === '[' ? ']' : '}'; const b = t.lastIndexOf(close);
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch {} }
  const e = new Error('bad_json'); e.code = 'bad_json'; throw e;
}
const webSample = {
  async json(input) {
    const messages = typeof input === 'string' ? [{ role: 'user', content: input }] : input.map(m => ({ role: m.role, content: String(m.content) }));

      let key = ''; try { key = localStorage.getItem('epl-key') || ''; } catch {}
      const r = await fetch('api/ai', { method: 'POST', headers: { 'content-type': 'application/json', 'x-app-key': key }, body: JSON.stringify({ messages }) });

        try { localStorage.setItem('epl-key', k.trim()); } catch {}
        continue;

      let d = {}; try { d = await r.json(); } catch {}
      if (!r.ok) { const e = new Error(d.code || 'web_error'); e.code = d.code || 'web_error'; throw e; }
